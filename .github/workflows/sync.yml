name: Sync cask

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the cask from floating-cam
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/neo22s/floating-cam/master/Casks/floating-camera.rb"
          curl -fsSL "$url" -o Casks/floating-camera.rb

          if git diff --quiet Casks/floating-camera.rb; then
            echo "Cask is already up to date"
            exit 0
          fi

          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/floating-camera.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "floating-camera ${version}" Casks/floating-camera.rb
          git push
